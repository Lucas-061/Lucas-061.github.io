<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Personal Webpage" />
    <meta name="author" content="Lucas-061" />
    <title id="title"></title>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/Lightsaber.ico" />

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Google fonts-->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&amp;display=swap"
        rel="stylesheet" />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <!-- Bootstrap core JS-->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

    <!-- For Compatability -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    
    <!-- Markdown -->
    <script type="text/javascript" src="static/js/marked.min.js"></script>

    <!-- Mathematics -->
    <script>
        // See https://docs.mathjax.org/en/latest/index.html for more details.
        MathJax = {
            tex: {
                packages: {},              // extensions to use
                inlineMath: [              // start/end delimiter pairs for in-line math
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [             // start/end delimiter pairs for display math
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                processEscapes: false,      // use \$ to produce a literal dollar sign
                processEnvironments: true, // process \begin{xxx}...\end{xxx} outside math mode
                processRefs: true,         // process \ref{...} outside of math mode
                digits: /^(?:[0-9]+(?:\{,\}[0-9]{3})*(?:\.[0-9]*)?|\.[0-9]+)/,    // pattern for recognizing numbers
                tags: 'all',              // or 'ams' or 'all'
                tagSide: 'right',          // side for \tag macros
                tagIndent: '0.8em',        // amount to indent tags
                useLabelIds: true,         // use label name rather than tag for ids
                maxMacros: 10000,          // maximum number of macro substitutions per expression
                maxBuffer: 5 * 1024,       // maximum size for the internal TeX string (5K)
                // baseURL:                   // URL for use with links to tags (when there is a <base> tag in effect)
                // (document.getElementsByTagName('base').length === 0) ? '' : String(document.location).replace(/#.*$/, ''),
                formatError:               // function called when TeX syntax errors occur
                    (jax, err) => jax.formatError(err)
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Core JS-->
    <script type="text/javascript" src="static/js/scripts.js"></script>
    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>

</head>

<body id="page-top">
    <!-- Navigation-->
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a id="page-top-title" class="navbar-brand fw-bold" href="#page-top"></a>
            <!-- <a href="#page-top"><img src="static/assets/img/CUMT_LOGO.svg" style="width: 11rem;"></a> -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                MENU
                <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#page-top">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#projects">PROJECTS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#map-notes">MAP NOTES</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Top Section -->
    <section class="top-section" style="background-image: url('static/assets/img/background.jpeg');">
        <div class="top-section-content">
            <div class="container px-5">
                <h2 id="top-section-bg-text" class="text-white display-3 lh-1 font-alt"></h2>
            </div>
        </div>
    </section>
    <!-- Top Section -->

    <!-- Photo -->
    <div class="container px-5">
        <div id="avatar">
            <img class="shadow" src="static/assets/img/photo.png">
        </div>
    </div>
    <!-- Photo -->
    
    <!-- Home -->
    <section class="bg-gradient-primary-to-secondary-light mt5 md5" id="home">
        <div class="container px-5">
            <header>
                <h2 id="home-subtitle"> </h2>
                <!-- <span class="bi bi-list"></span> -->
            </header>
            <div class="main-body" id="home-md"></div>
        </div>
    </section>
    <!-- Home -->

    <!-- Projects -->
    <section class="bg-gradient-primary-to-secondary-gray mt5 md5" id="projects">
        <div class="container px-5">
            <header>
                <h2 id="projects-subtitle"><i class="bi bi-folder-fill"></i>&nbsp;PROJECTS</h2>
            </header>
            <div class="main-body" id="projects-md"></div>
        </div>
    </section>
    <!-- Projects -->

    <!-- Map Notes -->
    <section class="bg-gradient-primary-to-secondary-light mt5 md5" id="map-notes">
        <div class="container px-5">
            <header>
                <h2 id="map-notes-subtitle"><i class="bi bi-geo-alt-fill"></i>&nbsp;MAP NOTES</h2>
            </header>
            <div class="map-notes-shell" data-map-notes>
                <div class="map-notes-map-panel">
                    <div class="map-library-bar">
                        <div class="map-city-tabs" data-map-tabs aria-label="City maps"></div>
                        <button class="map-note-button" type="button" data-action="add-map" title="Add city map">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                    </div>
                    <div class="map-add-form" data-map-form hidden>
                        <input type="text" data-map-name placeholder="City name">
                        <input type="file" data-map-file accept="image/*,.svg">
                        <button class="map-note-button text-button" type="button" data-action="save-map">Add</button>
                        <button class="map-note-button text-button" type="button" data-action="cancel-map">Cancel</button>
                    </div>
                    <div class="map-notes-toolbar" aria-label="Map note actions">
                        <button class="map-note-button" type="button" data-action="new" title="New note">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                        <button class="map-note-button" type="button" data-action="zoom-in" title="Zoom in">
                            <i class="bi bi-zoom-in"></i>
                        </button>
                        <button class="map-note-button" type="button" data-action="zoom-out" title="Zoom out">
                            <i class="bi bi-zoom-out"></i>
                        </button>
                        <button class="map-note-button" type="button" data-action="zoom-reset" title="Reset map view">
                            <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                        <button class="map-note-button" type="button" data-action="export" title="Export notes">
                            <i class="bi bi-download"></i>
                        </button>
                        <label class="map-note-button" title="Import notes">
                            <i class="bi bi-upload"></i>
                            <input class="visually-hidden" type="file" accept="application/json" data-action="import">
                        </label>
                    </div>
                    <div class="offline-map" data-map aria-label="Fuzhou offline map image for choosing note points">
                        <div class="offline-map-canvas" data-map-canvas>
                            <img class="offline-map-image" data-map-image src="static/map/fuzhou.jpeg" alt="Fuzhou offline map">
                            <div class="map-note-markers" data-markers></div>
                        </div>
                    </div>
                    <div class="map-note-list" data-list></div>
                </div>
                <article class="map-note-editor" data-editor>
                    <div class="map-note-empty" data-empty>Select a point or click the map to begin.</div>
                    <div class="map-note-form" data-form hidden>
                        <div class="map-note-meta">
                            <input type="text" data-title placeholder="Note title">
                            <button class="map-note-button danger" type="button" data-action="delete" title="Delete note">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        <div class="map-note-coordinates" data-coordinates></div>
                        <textarea data-body spellcheck="true" placeholder="Write with Markdown. Paste an image directly here."></textarea>
                        <div class="map-note-actions">
                            <span data-save-state>Saved locally</span>
                            <button class="map-note-button text-button" type="button" data-action="preview">Preview</button>
                            <button class="map-note-button text-button" type="button" data-action="edit">Edit</button>
                        </div>
                        <div class="map-note-preview main-body" data-preview hidden></div>
                    </div>
                </article>
            </div>
        </div>
    </section>
    <!-- Map Notes -->


    <!-- Footer-->
    <footer class="bg-bottom text-center py-5">
        <div class="container px-5">
            <div class="text-white-50 small">
                <div id="copyright-text" class="mb-2"></div>
                <a id="github-link" href="https://github.com/Lucas-061">Github</a>
            </div>
        </div>
    </footer>

    <script type="text/javascript" src="static/js/map-notes.js"></script>
</body>

</html>
